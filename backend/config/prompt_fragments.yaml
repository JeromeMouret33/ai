# Fragments de prompt modulaires — éditables dans l'app.
# Doc humain canonique : ../../prompts-config-goodcar.md (§2). Garder les deux synchro.
# L'assembleur (pipeline/prompt_builder.py) concatène les fragments selon l'angle
# (extérieur / intérieur) et les options actives — logique en §3 du doc.
# Variables injectées au moment de l'assemblage :
#   {ANGLE}, {FRAMING_PRESET}, {LOGO_POSITION_SIZE}, {RATIO}, {RESOLUTION}.

role: |
  Professional automotive studio photographer and compositor.

vehicle_lock: |
  Reproduce THIS exact car faithfully: same model, trim, body colour, wheels/rims,
  headlights and tail lights, grille, badges and lettering — it must clearly be the
  same vehicle. Copy the headlights and tail lights EXACTLY: keep their outline and
  their internal LED / light-graphic pattern faithful to the source — do not redraw,
  reshape, simplify, smooth out or reinvent the optics. You MAY re-photograph it from
  the showroom's natural eye-level camera at the requested angle; you do NOT have to
  copy the source photo's viewpoint or perspective. Keep its design and proportions
  believable and consistent; do not turn it into a different model or restyle it.

ref_showroom: |
  Reproduce the SHOWROOM image faithfully: same white matte walls and corner, soft
  warm lighting, light-grey floor with a subtle reflection. Do not redesign,
  recolour, relight or move the environment.

ref_logo: |
  Place the GOODCAR logo (logo image) on the upper-left wall as a FLAT sign in its
  real colours — same shapes, text and colours, correct aspect ratio, crisp and
  legible. Not a monochrome engraving, not tinted to the wall colour.
  Position: {LOGO_POSITION_SIZE}.

ref_vehicle: |
  VEHICLE image — the exact car to feature.

ref_plate: |
  PLATE image — the GOODCAR license plate to apply to the vehicle.

task_base: |
  Place the car inside the showroom as a real photo taken on location, shown at:
  {ANGLE}. Photograph it at natural eye level, with realistic proportions relative
  to the room, wheels firmly on the floor, a soft contact shadow and a subtle
  reflection on the floor. Use the showroom's soft, even, slightly warm studio
  light, and remove the source photo's sun glare, blown highlights and harsh shadows.

relight: |
  Even out the lighting and remove sun hotspots and harsh shadows on the smooth body
  panels and side/rear glass, matching the soft studio light. Do not change the
  paint colour, and do not alter the lights, wheels, grille or badges.

plate: |
  Replace the visible license plate(s) with the plate from the plate image, fitted
  in correct perspective, undistorted.

composition: |
  COMPOSITION ({ANGLE}): {FRAMING_PRESET}

constraints: |
  Output {RATIO}, {RESOLUTION}, photoreal and clean. Keep the showroom identical to
  the showroom image. It must clearly remain the same car (model, colour, wheels,
  lights, badges). No added text, watermark, people or extra objects.

interior: |
  INTERIOR: Keep the cabin from the vehicle image exactly as-is; do not place it in
  a showroom, do not add the logo, do not relight. Only replace what is visible
  through the windows with clean, evenly blown-out white. Preserve all interior
  details, materials and colors. Do NOT redraw or restyle any part of the interior.

# Presets de cadrage par angle (doc §6). slug -> { angle: {ANGLE}, framing: {FRAMING_PRESET} }.
# La classification renvoie un slug ; l'assembleur injecte angle + framing dans `composition`.
angle_presets:
  face-avant:
    angle: "front"
    framing: "straight front, centered, slightly low camera."
  3-4-avant-gauche:
    angle: "front 3/4 left"
    framing: "angled, front-left visible, slightly low camera, car ~70% of frame width, centered."
  3-4-avant-droit:
    angle: "front 3/4 right"
    framing: "mirror of front 3/4 left: angled, front-right visible, slightly low camera, car ~70% of frame width, centered."
  profil-gauche:
    angle: "profile left"
    framing: "full side, eye-level, ~80% frame width."
  profil-droit:
    angle: "profile right"
    framing: "full side, eye-level, ~80% frame width."
  3-4-arriere-gauche:
    angle: "rear 3/4 left"
    framing: "rear visible, same logic (angled, slightly low camera, car ~70% of frame width, centered)."
  3-4-arriere-droit:
    angle: "rear 3/4 right"
    framing: "rear visible, same logic (angled, slightly low camera, car ~70% of frame width, centered)."
  arriere:
    angle: "rear"
    framing: "straight rear, centered, slightly low camera."
  interieur:
    angle: "interior"
    framing: ""   # variante `interior`, pas de showroom
  detail:
    angle: "detail"
    framing: "close-up; neutral background or per decision."

# --- Instructions des agents vision (HORS pack version A — ajout Phase 1, à affiner) ---
# Utilisées par pipeline/classify.py et pipeline/qc.py. Éditables comme les autres fragments.
# {ANGLES} est injecté avec la liste des slugs valides au moment de l'appel.

classify_instruction: |
  You are an automotive photo angle classifier. Look at the single vehicle photo
  and decide from which viewpoint the car (or its interior) is shown.
  Respond with STRICT JSON only, no prose:
    {"angle": "<one slug from the list>", "confidence": <float 0..1>}
  The slug MUST be exactly one of: {ANGLES}.
  Guidance:
    - "face-avant": straight front. "arriere": straight rear.
    - "3-4-avant-gauche"/"3-4-avant-droit": front three-quarter, left/right side visible.
    - "3-4-arriere-gauche"/"3-4-arriere-droit": rear three-quarter, left/right side visible.
    - "profil-gauche"/"profil-droit": full side profile, left/right.
    - "interieur": cabin / interior shot.
    - "detail": close-up of a part (wheel, badge, light…), not a full-car angle.
  "confidence" is your certainty in the chosen slug.

qc_instruction: |
  You are a strict quality controller for AI-generated automotive showroom photos.
  Image 1 is the AI-GENERATED showroom photo. Image 2 (if provided) is the ORIGINAL
  source photo of the vehicle — use it as the reference to judge fidelity.
  Verify on image 1:
    1. The showroom background is clean (white matte walls, soft warm light,
       light-grey floor) with no extra objects, text or people, and the car sits
       naturally in the room (eye-level perspective, realistic proportions, wheels
       on the floor).
    2. The GOODCAR logo (if present) is flat, in its real colours, crisp, legible,
       undistorted, placed once on the upper-left wall, not overlapping the car.
    3. The car MATCHES the source vehicle (image 2): same model, paint colour,
       wheels/rims, grille, badges. ZOOM IN on the headlights and tail lights:
       their outline and internal LED / light-graphic pattern must match the
       source — any invented, deformed, simplified or restyled optic is a failure.
       (A different camera angle or studio lighting than the source is FINE.)
  Respond with STRICT JSON only, no prose:
    {"verdict": "ok" | "ko", "reasons": ["<short reason>", ...]}
  Use "ok" only if every check passes. List concrete reasons for any "ko".
