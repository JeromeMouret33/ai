# Paramètres globaux & options — éditables dans l'app.
# Doc humain canonique : ../../prompts-config-goodcar.md (§4). Garder les deux synchro.

parametres:
  # Trois rôles IA, chacun avec son propre modèle (via OpenRouter).
  models:
    classification: "openai/gpt-4o-mini"             # vision (détection d'angle)
    generation: "google/gemini-3-pro-image-preview"  # Nano Banana Pro (défaut)
    qc: "openai/gpt-4o-mini"                          # vision (contrôle qualité)
  ratio: "3:2"               # format photo classique (configurable : 4:3, 16:9…)
  resolution: "1K"           # palier natif Nano Banana
  candidates_per_photo: 1    # défaut verrouillé à 1 (configurable dans l'app)
  max_retries: 2
  logo_position_size: "back wall, upper-left; logo left edge ~7% from frame's left border; width ~17% of frame width; vertical center ~30% from top; subtle raised 3D relief; never overlapping the vehicle"
  drive_parent_folder: ""    # TODO: id ou chemin du dossier Drive parent

nomenclature:                  # éditable dans l'app — lue par pipeline/naming.py
  dossier: "{client_nom} {client_prenom} - {Marque} {Modèle}"  # client d'abord, puis véhicule
  fichier: "{marque}-{modele}_{angle}.jpg" # {marque}/{modele} = slugs ; {angle} = slug d'angle
  angles: [face-avant, 3-4-avant-gauche, 3-4-avant-droit, profil-gauche,
           profil-droit, 3-4-arriere-gauche, 3-4-arriere-droit, arriere,
           interieur-01, detail-01]
  doublon_meme_angle: "suffixe -01, -02"
  toujours_numerotes: [interieur, detail]  # angles numérotés même en un seul exemplaire

options:
  relight_enabled: true        # relighting version A (surfaces lisses + vitres lat./arrière)
  plate_enabled: true          # remplacer la plaque par la PLATE image
  interior_window_whiten: true # blanchiment des vitres en intérieur
  purge_apres_export: false    # supprimer les rendus du stockage app après export Drive

references_actives:            # asset choisi dans chaque bibliothèque uploadable (résolu en Phase 2)
  showroom_asset_id: ""        # id de la vignette sélectionnée
  logo_asset_id: ""            # id de la vignette sélectionnée
  plate_asset_id: ""           # id de la vignette sélectionnée
